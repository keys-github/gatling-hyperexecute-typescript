gatling {
  charting {
    # Generate HTML reports after simulation
    noReports = false

    # Response time indicator buckets (in milliseconds)
    # Requests are categorized as: < lowerBound | lowerBound-upperBound | > upperBound
    indicators {
      lowerBound = 800
      upperBound = 1200

      # Percentiles shown in the report
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }

  data {
    # Data writers: console (live stats) + file (for HTML report generation)
    writers = [console, file]

    # Console output frequency (in seconds)
    console {
      writePeriod = 5
    }

    # File writer outputs simulation.log used by Gatling HTML report generator
    file {
      bufferSize = 8192
    }
  }
}
